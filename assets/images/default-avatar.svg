<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Avatar par défaut">
  <!--
    Avatar de repli, affiché pour tout compte sans photo : en-tête, salons de
    discussion, profils. Référencé dans 10 vues et pointé par les attributs
    `onerror`, il doit exister — sinon l'image cassée le reste.
    Format vectoriel : net à toutes les tailles, 1 Ko, aucune dépendance.
  -->
  <defs>
    <linearGradient id="ca-av-fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2ECFF"/>
      <stop offset="100%" stop-color="#E4D8FC"/>
    </linearGradient>
    <clipPath id="ca-av-cercle">
      <circle cx="48" cy="48" r="48"/>
    </clipPath>
  </defs>

  <rect width="96" height="96" fill="url(#ca-av-fond)"/>

  <g clip-path="url(#ca-av-cercle)" fill="#8B52FA">
    <!-- Tête -->
    <circle cx="48" cy="38" r="16"/>
    <!-- Buste, débordant volontairement sous le cadrage circulaire -->
    <path d="M48 60c-16.6 0-30 11.4-30 25.4V104h60V85.4C78 71.4 64.6 60 48 60z"/>
  </g>
</svg>
