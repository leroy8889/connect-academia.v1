server {
    listen 80;
    server_name connectacademia.io www.connectacademia.io;

    root /var/www/connectacademia.io;
    index index.php;

    charset utf-8;

    # ── Taille maximale des fichiers téléversés (Ex: Images profil) ──
    client_max_body_size 64M;

    # ── Bloquer dossiers internes ─────────────────────────────────
    location ~ ^/(app|config|storage|database|docs)(/|$) {
        deny all;
        return 403;
    }

    # ── Bloquer fichiers sensibles ────────────────────────────────
    location ~ \.(env|log|sql|gitignore|lock)$ {
        deny all;
        return 403;
    }

    # ── Routing principal → index.php ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ── Headers sécurité ─────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Cache assets statiques ────────────────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
    }

    # ── Vidéos : range requests ───────────────────────────────────
    location ~* \.(mp4|m4v|webm|ogv|ogg|mp3)$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── PWA : manifest ────────────────────────────────────────────
    location = /manifest.json {
        add_header Content-Type "application/manifest+json; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    # ── PWA : Service Worker ──────────────────────────────────────
    location = /sw.js {
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # ── Gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript text/plain;
}