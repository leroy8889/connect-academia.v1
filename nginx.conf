# ════════════════════════════════════════════════════════════════════════════
#  Connect'Academia — Configuration nginx PRODUCTION (VPS one.com / PHP-FPM 8.3)
#  ---------------------------------------------------------------------------
#  En production, nginx NE LIT PAS le fichier .htaccess (spécifique à Apache).
#  Ce fichier reproduit À L'IDENTIQUE toutes les règles de sécurité et de
#  comportement du .htaccess local, plus le blocage de l'exécution PHP dans les
#  dossiers d'upload (indispensable : le webroot = racine du projet, donc app/,
#  config/, vendor/ et .env sont potentiellement servables sans ce blocage).
#
#  DÉPLOIEMENT
#   1. Copier ce fichier dans /etc/nginx/sites-available/connectacademia.io
#   2. Adapter `root` (chemin réel du projet) et le socket PHP-FPM ci-dessous.
#   3. Placer IDÉALEMENT le .env HORS du webroot (dossier parent) — index.php le
#      cherche d'abord dans `dirname(racine)/.env`. Sinon ce fichier le bloque.
#   4. ln -s vers sites-enabled/ ; `nginx -t` ; `systemctl reload nginx`.
#
#  Les en-têtes de sécurité applicatifs (CSP, HSTS, X-Frame-Options, cookie
#  Secure…) sont posés par index.php et fonctionnent sur TOUS les serveurs :
#  ils ne sont donc PAS dupliqués ici (une double émission créerait des doublons).
# ════════════════════════════════════════════════════════════════════════════

# ── Ne pas divulguer la version de nginx (à mettre aussi dans http{} global) ──
server_tokens off;

# ── HTTP :80 → redirection HTTPS + challenge ACME (Let's Encrypt) ────────────
# Si la terminaison TLS est assurée par un proxy amont (load-balancer one.com),
# supprimez ce bloc et faites écouter le bloc principal ci-dessous en `listen 80;`
# (index.php détecte déjà HTTPS via l'en-tête X-Forwarded-Proto).
server {
    listen 80;
    listen [::]:80;
    server_name connectacademia.io www.connectacademia.io;

    # Renouvellement des certificats Let's Encrypt : seul chemin autorisé en clair.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur applicatif HTTPS :443 ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name connectacademia.io www.connectacademia.io;

    # ⚠️ ADAPTER : racine du projet (là où se trouve index.php).
    root /var/www/connectacademia.io;
    index index.php;

    charset utf-8;

    # ── TLS ─────────────────────────────────────────────────────────────────
    # ⚠️ ADAPTER les chemins de certificats (Let's Encrypt / fournis par one.com).
    ssl_certificate     /etc/letsencrypt/live/connectacademia.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connectacademia.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Taille max des corps de requête ─────────────────────────────────────
    # Aligné sur post_max_size de .user.ini (620M) pour que nginx ne soit JAMAIS
    # le goulot d'étranglement (sinon 413 avant même que PHP applique sa limite).
    # Les vidéos d'orientation partent en upload direct navigateur→B2 (présigné)
    # et ne transitent pas par nginx ; cette valeur couvre le repli côté serveur.
    client_max_body_size 620M;
    client_body_timeout  600s;

    # ════════════════════════════════════════════════════════════════════════
    #  BLOCAGE DES FICHIERS & DOSSIERS SENSIBLES  (miroir du .htaccess)
    #  Les `location ~` (regex) sont évalués AVANT `location /`, et le PREMIER
    #  qui matche gagne : ces blocs doivent donc précéder le routage et le PHP.
    # ════════════════════════════════════════════════════════════════════════

    # Empêcher l'exécution PHP dans les dossiers d'upload et de stockage.
    # (Un fichier .php déposé via un upload piégé ne doit JAMAIS être interprété.)
    # DOIT être déclaré AVANT le `location ~ \.php$` général.
    location ~* ^/(public/uploads|storage)/.*\.php$ {
        deny all;
        return 403;
    }

    # Tout dotfile (.env, .git, .htaccess, .user.ini, .DS_Store…) SAUF .well-known
    location ~ /\.(?!well-known) {
        deny all;
        return 403;
    }

    # Extensions sensibles, à n'importe quelle profondeur
    location ~* \.(env|log|sql|sqlite|lock|ini|bak|old|dist|example|sh|yml|yaml|conf)$ {
        deny all;
        return 403;
    }

    # Fichiers projet à la racine (composer, package, README, LICENSE)
    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|README|LICENSE) {
        deny all;
        return 403;
    }

    # Répertoires internes (le webroot = racine du projet → tout est exposé sinon)
    location ~ ^/(app|config|storage|database|Database|docs|vendor|node_modules|bin|migrations)(/|$) {
        deny all;
        return 403;
    }

    # ── PWA : Service Worker (jamais mis en cache, scope racine) ─────────────
    location = /sw.js {
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # ── PWA : manifest ──────────────────────────────────────────────────────
    location = /manifest.json {
        add_header Content-Type "application/manifest+json; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Vidéos / audio : lecture progressive (range requests natifs nginx) ───
    location ~* \.(mp4|m4v|webm|ogv|ogg|mp3|oga)$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ── Cache des assets statiques (1 mois / immutable) ─────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|eot)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Routage principal : sert le fichier réel sinon → index.php ──────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ──────────────────────────────────────────────────────────────
    # ⚠️ ADAPTER le socket au nom réel du pool PHP-FPM (php -v pour la version).
    location ~ \.php$ {
        # `try_files … =404` empêche l'exécution d'un chemin PATH_INFO piégé
        # (ex. /uploads/img.jpg/x.php) — durcissement classique nginx+FPM.
        try_files $uri =404;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        include fastcgi_params;

        # Doit couvrir max_execution_time de .user.ini (600s) : reçus PDF, exports…
        fastcgi_read_timeout 600s;
        fastcgi_buffers      16 16k;
        fastcgi_buffer_size  32k;
    }

    # ── Compression ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml application/xml;
}
